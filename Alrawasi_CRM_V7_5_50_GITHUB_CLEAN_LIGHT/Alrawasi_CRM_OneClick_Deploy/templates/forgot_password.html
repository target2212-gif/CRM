{% extends 'base.html' %}{% block content %}
<div class="row justify-content-center mt-5"><div class="col-md-6"><div class="card p-4">
<img class="crm-login-logo" src="{{ url_for('static', filename='branding/alrawasi-hills-logo.jpg') }}" alt="تلال الرواسي">
<h3 class="mb-3">استعادة كلمة مرور المدير</h3>
<div class="alert alert-info">هذه الصفحة تعيد تعيين كلمة مرور حساب مدير نشط فقط. استخدم رمز الاستعادة المحفوظ في Render باسم <b>ADMIN_RECOVERY_KEY</b>.</div>
<form method="post" autocomplete="off">
<label class="form-label">بريد حساب المدير</label>
<input class="form-control mb-3" name="email" type="email" required>
<label class="form-label">رمز الاستعادة</label>
<input class="form-control mb-3" name="recovery_key" type="password" required>
<label class="form-label">كلمة المرور الجديدة</label>
<input class="form-control mb-3" name="password" type="password" minlength="10" required>
<label class="form-label">تأكيد كلمة المرور الجديدة</label>
<input class="form-control mb-3" name="confirm_password" type="password" minlength="10" required>
<button class="btn btn-dark w-100">تعيين كلمة المرور الجديدة</button>
</form>
<a class="btn btn-link mt-2" href="{{ url_for('login') }}">العودة لتسجيل الدخول</a>
</div></div></div>
{% endblock %}
